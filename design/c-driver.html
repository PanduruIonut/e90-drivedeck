<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><title>C · Driver</title>
<link rel="stylesheet" href="base.css">
<style>
  .car { width: 300px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 18px 10px; }
  .car .speed { font-size: 96px; font-weight: 700; line-height: .9; margin-top: 4px; }
  .car .unit { color: var(--muted); font-size: 16px; }
  .car .limit { position: absolute; right: 18px; top: 18px; width: 50px; height: 50px; border-radius: 50%;
                border: 6px solid #ff3b30; background: #fff; color: #000; display: grid; place-items: center;
                font-weight: 800; font-size: 19px; }
  .car svg { margin-top: 10px; }
  .car .gear { display: flex; gap: 16px; font-size: 18px; color: var(--muted); font-weight: 600; margin-top: 6px; }
  .car .gear b { color: var(--text); }
  .map { flex: 1; }
  .media { width: 250px; flex: none; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .media .art { width: 100%; aspect-ratio: 1; }
  .media .title { font-size: 18px; }
  .media .artist { font-size: 14px; }
  .media .controls span { font-size: 26px; }
  .media .controls .play { width: 54px; height: 54px; font-size: 22px; }
  .media .tabs span { padding: 5px 9px; font-size: 12px; }
</style></head>
<body>
  <nav class="dock">
    <div class="time">14:32</div><div class="status">4G ▮▮▮</div>
    <div class="apps">
      <div class="app grid active">▦</div>
      <div class="app waze">☺</div>
      <div class="app spotify">♫</div>
      <div class="app youtube">▶</div>
    </div>
  </nav>

  <section class="card car">
    <div class="label">BMW E90</div>
    <div class="speed">62</div><div class="unit">km/h</div>
    <svg width="120" height="190" viewBox="0 0 120 190" aria-label="E90 top view">
      <defs><linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#6b7280"/><stop offset=".5" stop-color="#d1d5db"/><stop offset="1" stop-color="#6b7280"/></linearGradient></defs>
      <rect x="18" y="8" width="84" height="174" rx="34" fill="url(#body)"/>
      <rect x="28" y="52" width="64" height="40" rx="10" fill="#1f2937"/>
      <rect x="30" y="118" width="60" height="30" rx="9" fill="#1f2937"/>
      <rect x="24" y="12" width="20" height="8" rx="3" fill="#fde68a"/><rect x="76" y="12" width="20" height="8" rx="3" fill="#fde68a"/>
      <rect x="26" y="172" width="18" height="6" rx="2" fill="#ef4444"/><rect x="76" y="172" width="18" height="6" rx="2" fill="#ef4444"/>
    </svg>
  </section>

  <section class="card map">
    <svg viewBox="0 0 560 460" preserveAspectRatio="xMidYMid slice">
      <rect width="560" height="460" fill="#1b1f26"/>
      <g fill="#232933">
        <rect x="20" y="30" width="140" height="110" rx="6"/><rect x="190" y="30" width="150" height="110" rx="6"/>
        <rect x="370" y="30" width="170" height="110" rx="6"/><rect x="20" y="175" width="200" height="120" rx="6"/>
        <rect x="250" y="175" width="120" height="120" rx="6"/><rect x="400" y="175" width="140" height="120" rx="6"/>
        <rect x="20" y="330" width="250" height="110" rx="6"/><rect x="300" y="330" width="240" height="110" rx="6"/>
      </g>
      <g stroke="#3a4250" stroke-width="12" fill="none" stroke-linecap="round">
        <path d="M0 158 H560"/><path d="M0 313 H560"/><path d="M175 0 V460"/><path d="M385 0 V460"/>
      </g>
      <path d="M280 470 V313 H385 V158 H560" stroke="#0a84ff" stroke-width="13" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="280" cy="405" r="15" fill="#fff"/><path d="M280 393 l9 20 -9 -5 -9 5z" fill="#0a84ff"/>
    </svg>
    <div class="turn">
      <div class="arrow"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 21V11h9V7l6 6-6 6v-4H9v6z" fill="#fff"/></svg></div>
      <div><div class="dist">300 m</div><div class="street">Str. Republicii</div></div>
    </div>
    <div class="eta"><div><b>14:51</b>sosire</div><div><b>19 min</b>timp</div></div>
  </section>

  <aside class="card media">
    <div class="tabs"><span class="on">Spotify</span><span>YouTube</span><span>YT Music</span></div>
    <div class="art"></div>
    <div><div class="title">Midnight City</div><div class="artist">M83</div></div>
    <div class="controls"><span>⏮</span><div class="play">❚❚</div><span>⏭</span></div>
  </aside>
</body></html>
